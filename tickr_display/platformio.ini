; TickrDisplay - alternative firmware for the TickrMeter e-ink ticker
; (ESP32-D0WD-V3 / ESP32-WROOM-32E).
;
; Environments:
;   tickr      (default) stock 4 MB partition table - OTA-compatible with the
;                        stock bootloader/partition table (see below).
;   tickr_dev            `tickr` + developer extras (-DTICKR_ARDUINO_OTA: LAN
;                        push-OTA on port 3232 + mDNS, ~31 KB). Not for release.
;   native               host build for unit tests (`pio test -e native`).
;
; See docs/DEVELOPMENT.md for details.

[platformio]
default_envs = tickr
description = TickrDisplay - cloud-free e-ink display firmware for TickrMeter

; ---------------------------------------------------------------------------
; Shared settings
; ---------------------------------------------------------------------------
[common]
; ESP32 Arduino core log verbosity: 0=none 1=error 2=warn 3=info 4=debug 5=verbose.
; 0 in release builds keeps the image small; raise it temporarily when debugging.
core_debug_level = 0

; ---------------------------------------------------------------------------
; Base for all firmware (embedded) environments
; ---------------------------------------------------------------------------
[esp32]
; Pinned: the toolchain/framework download is slow and the source uses the
; Arduino-ESP32 2.x LEDC API (ledcSetup/ledcAttachPin). Bumping to espressif32 7.x
; is fine; do NOT move to a platform that ships Arduino-ESP32 3.x without porting.
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino

board_build.filesystem = littlefs
; f_flash / flash_mode intentionally left at board defaults (40 MHz, dio):
; the stock firmware's settings have not been dumped yet.

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; Exact versions (reproducible builds). Bump deliberately and re-test.
lib_deps =
    zinggjm/GxEPD2 @ 1.6.9
    adafruit/Adafruit GFX Library @ 1.12.6
    adafruit/Adafruit BusIO @ 1.17.4
    bblanchon/ArduinoJson @ 6.21.6
    knolleary/PubSubClient @ 2.8.0
    ESP32Async/ESPAsyncWebServer @ 3.12.1
    ESP32Async/AsyncTCP @ 3.5.0

build_flags =
    -DCORE_DEBUG_LEVEL=${common.core_debug_level}
    ; ArduinoJson: payloads are small text/ints - no need for double/long long.
    -DARDUINOJSON_USE_DOUBLE=0
    -DARDUINOJSON_USE_LONG_LONG=0
    ; printf family from the ESP32 ROM ("newlib nano" build) instead of the
    ; full newlib copy in flash (docs/DEVELOPMENT.md "Build flags"). The ROM
    ; variant has NO floating-point conversions (%f %g %e - use
    ; src/logic/fmt_float.h) and no 64-bit integers (%lld %llu); the firmware
    ; and its libraries use neither. src/hal/rom_hooks.cpp installs a
    ; safety stub for a stray %f (prints "?" instead of crashing) and
    ; scripts/check_float_printf.py fails the build on one in src/.
    ; PlatformIO prints "'-Wl,-T' ... is deprecated, use board_build.ldscript"
    ; for this line; that option is not wired into the Arduino-ESP32 builder
    ; (it passes its own -T list), so the flag stays here.
    -Wl,-T,esp32.rom.newlib-nano.ld
    ; No core dump to flash on a panic (libespcoredump + its RAM): the panic
    ; handler prints the backtrace and reboots as before. The two IDF entry
    ; points are replaced by no-ops in src/hal/rom_hooks.cpp.
    -Wl,--wrap=esp_core_dump_init
    -Wl,--wrap=esp_core_dump_to_flash
    ; Opt-in features (off in release builds, see [env:tickr_dev]):
    ;   -DTICKR_ARDUINO_OTA   ArduinoOTA (espota, TCP 3232) + ESPmDNS/libmdns, ~31 KB flash
    ;   -DTICKR_MAX_PEERS=N   size of the multi-device peer table (default 16, 40 B each)
    ;   -DTICKR_PAIR_DEBUG_SCREEN  /api/screen.* stays readable during pairing (tests only)
    ;   -DTICKR_RECOVERY_TEST  software restarts count as power cycles, POST /api/recovery/enter,
    ;                          2/4 min recovery timeouts - remote testing of recovery mode only
    ;   -DTICKR_POWER_PROBE   boot-time ADC2 scan + GPIO pull probe, GET /api/power/probe,
    ;                          adc2_boot in /api/power/raw - power-sensing diagnostics for board rev. B
    ;   -DTICKR_DEV_PAGE      serve the /dev diagnostics page (www/src/dev.html, ~4.3 KB gz in PROGMEM);
    ;                          the release image answers 404 and /system hides the links
    ;   -DTICKR_LOG_VERBOSE   informational serial lines (src/log.h); release keeps errors + transitions

; Warnings for *our* sources only (-Wall -Wextra) are applied by
; scripts/src_warnings.py so that third-party libraries stay quiet.
; The Arduino-ESP32 framework passes -Wno-unused-parameter -Wno-sign-compare
; globally; GCC keeps explicit -Wno-* even after a later -Wall, so re-enable them.
custom_src_warnings = -Wall -Wextra -Wunused-parameter -Wsign-compare

; scripts/version.py   (pre)  : -DFIRMWARE_VERSION="<git describe>" + copies the
;                               final image to dist/tickrdisplay-<version>[suffix].bin
; scripts/build_www.py (pre)  : www/src/*.html -> gzip -> src/web/generated/www_assets.h
;                               (git-ignored build product; fails above the 40 KB web gate)
; scripts/build_ca_bundle.py (pre): certs/*.pem -> IDF bundle -> src/generated/ca_bundle.h
;                               (git-ignored; the TLS roots of the ticker sources, docs/TICKERS.md "TLS")
; scripts/check_float_printf.py (pre): fails the build on a %f / %g / %e / %lld
;                               format in src/ - unsupported by the ROM printf (see build_flags)
; scripts/check_size.py (post): fails the build if firmware.bin exceeds the
;                               stock OTA partition (1 310 720 bytes), warns at 95 %.
extra_scripts =
    pre:scripts/version.py
    pre:scripts/build_www.py
    pre:scripts/build_ca_bundle.py
    pre:scripts/check_float_printf.py
    post:scripts/src_warnings.py
    post:scripts/check_size.py

; Unit tests run on the host (env:native) only - nothing to run on-device.
test_ignore = *

; `pio check` (cppcheck) - project sources only.
check_tool = cppcheck
check_skip_packages = yes
check_src_filters = +<src/>
; Defects found inside library headers (.pio/libdeps) while parsing src/ are suppressed.
check_flags =
    cppcheck: --enable=warning,style,performance,portability --inline-suppr --std=c++17 --suppress=*:*/.pio/* --suppress=*:.pio/* --suppress=unusedFunction --suppress=missingIncludeSystem

; ---------------------------------------------------------------------------
; Partition table - WHY THE 4 MB TABLE
; ---------------------------------------------------------------------------
; The stock TickrMeter bootloader and firmware are built for 4 MB flash with
; the standard Arduino `default.csv` table (app0/app1 = 0x140000 = 1 310 720
; bytes each, 0x160000 = 1.375 MB SPIFFS/LittleFS). The installation path is
; OTA through the stock `/update` page, which writes into app0/app1 and never
; rewrites the partition table, so the image must fit one slot and is built
; against that layout. The module has 8 MB flash (see docs/HARDWARE.md), but
; the upper half is unusable until bootloader + table are re-flashed over
; UART; the app resolves all partitions by label at runtime, so the same
; image runs on either table.

[env:tickr]
extends = esp32
board_build.partitions = default.csv
board_upload.flash_size = 4MB
custom_bin_suffix =

; Developer build: same partition table as `tickr`, plus ArduinoOTA + mDNS so
; `pio run -e tickr_dev -t upload --upload-port <ip> --upload-flag --auth=<ota_password>`
; works (see docs/DEVELOPMENT.md). CI builds it to keep the code compiling;
; it is not a release artifact and not covered by the size target.
[env:tickr_dev]
extends = esp32
board_build.partitions = default.csv
board_upload.flash_size = 4MB
custom_bin_suffix = -dev
build_flags =
    ${esp32.build_flags}
    -DTICKR_ARDUINO_OTA=1
    ; upper bound of the peer table (docs/MULTI_DEVICE.md "The peer table") so CI exercises it
    -DTICKR_MAX_PEERS=48
    ; keep /api/screen.* readable while a pairing screen is shown (release hides
    ; the frame so the code cannot be read off the network) - test automation only
    -DTICKR_PAIR_DEBUG_SCREEN=1
    ; recovery mode drivable over the LAN (SW restart = power cycle, /api/recovery/enter,
    ; short timeouts) - never in a release image
    -DTICKR_RECOVERY_TEST=1
    ; the /dev diagnostics page (LED / sound / screen tests, partitions, raw JSON) -
    ; developer material, not in the release image (docs/DEVELOPMENT.md "Web UI")
    -DTICKR_DEV_PAGE=1
    ; informational serial lines (src/log.h LOGV): progress, addresses, timings,
    ; payload dumps - the release keeps errors and one line per state transition
    -DTICKR_LOG_VERBOSE=1
    ; -DTICKR_POWER_PROBE=1 (power-sensing diagnostics, docs/HARDWARE.md "Power sensing")
    ; is not part of this build: the sense network is known on both revisions. The code
    ; stays under the flag - add the line back to re-run the diagnostics.

; ---------------------------------------------------------------------------
; Host unit tests: pio test -e native
; ---------------------------------------------------------------------------
; Compiles the pure-logic modules under src/logic/ (no Arduino/HAL
; dependencies) together with test/test_*/ using the
; Unity framework. Excluded explicitly: renderer.cpp drives the display/LED HAL,
; command_queue.cpp wraps a FreeRTOS queue and executes commands on the HAL.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<logic/*>
    -<logic/renderer.cpp>
    -<logic/command_queue.cpp>
build_flags =
    -std=c++17
    -Wall -Wextra
    -fsanitize=address,undefined -fno-omit-frame-pointer
    -DNATIVE_BUILD
    -DARDUINOJSON_USE_DOUBLE=0
    -DARDUINOJSON_USE_LONG_LONG=0
lib_deps =
    bblanchon/ArduinoJson @ 6.21.6
